<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Result</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .form-container {
      margin-bottom: 20px;
    }
    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }
    th, td {
      padding: 10px;
      border: 1px solid #444;
      text-align: center;
    }
    th {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>🎓 Student Result Portal</h1>

  <div class="form-container">
    <label>Register Number:</label>
    <input type="text" id="regno" placeholder="Enter Register Number" required />
    <label>Date of Birth:</label>
    <input type="date" id="dob" required />
    <button onclick="getResult()">Submit</button>
  </div>

  <div id="result-container" style="display:none;">
    <h2 id="studentName"></h2>
    <h3 id="semester"></h3>

    <table id="resultTable">
      <thead>
        <tr>
          <th>Subject Code</th>
          <th>Subject Name</th>
          <th>Grade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Dynamic rows here -->
      </tbody>
    </table>
  </div>

  <script>
    async function getResult() {
      const regno = document.getElementById("regno").value.trim();
      const dob = document.getElementById("dob").value;

      if (!regno || !dob) {
        alert("Please enter Register Number and DOB");
        return;
      }

      try {
        const res = await fetch("http://localhost:5000/student/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ regno, dob })
        });

        const data = await res.json();

        if (!data.status) {
          alert(data.message);
          return;
        }

        // Show student info
        document.getElementById("studentName").textContent = "Name: " + data.name;
        document.getElementById("semester").textContent = "Semester: " + data.semester;
        document.getElementById("result-container").style.display = "block";

        // Display subjects
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        data.subjects.forEach((subj) => {
          const row = `<tr>
            <td>${subj.subjectCode}</td>
            <td>${subj.subjectName}</td>
            <td>${subj.grade}</td>
            <td>${subj.result}</td>
          </tr>`;
          tbody.innerHTML += row;
        });

      } catch (err) {
        console.error(err);
        alert("Server error or backend not running!");
      }
    }
  </script>
</body>
</html>
